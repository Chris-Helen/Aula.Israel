    <h1>Documentos</h1>
    <p>Anexe os documentos abaixo (formatos aceitos: PDF, JPG ou PNG):</p>
    <br>

    <form>
        <label><b>Documento de Identidade do aluno (RG):</b> <input type="file" name="rg" accept=".pdf, .jpg, .png"></label>
        <br><br>
        <label><b>CPF do aluno:</b> <input type="file" name="cpf" accept=".pdf, .jpg, .png"></label>
        <br><br>
        <label><b>Comprovante de Residência:</b> <input type="file" name="comprovante_residencia" accept=".pdf, .jpg, .png"></label>
        <br><br>
        <label><b>Histórico Escolar ou declaração:</b> <input type="file" name="historico_escolar_ou_declaracao" accept=".pdf, .jpg, .png"></label>
