    <h1>Dados Acadêmicos</h1>
    <p>Por favor, preencha os campos abaixo com seus dados acadêmicos:</p>
    <br>

    <label><b>Curso que deseja se matricular:</b>
        <select name="curso">
            <option value="cc">Ciência da Computação</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="si">Sistemas de Informação</option>
            <option value="es">Engenharia de Software</option>
        </select>
    </label>
    <form>
        <p><b>Turno desejado:</b></p>
        <label><input type="radio" name="turno" value="matutino"> Matutino</label>
        <label><input type="radio" name="turno" value="vespertino"> Vespertino</label>
        <label><input type="radio" name="turno" value="noturno"> Noturno</label>
    </form>
    <form>
        <p><b>Forma de ingresso:</b></p>
        <label><input type="radio" name="ingresso" value="vestibular"> Vestibular</label>
        <label><input type="radio" name="ingresso" value="enem"> ENEM</label>
        <label><input type="radio" name="ingresso" value="transferencia"> Transferência</label>
    </form>
    <form>
        <p><b>Você já estudou na UNIPÊ?</b></p>
        <label><input type="radio" name="estudou" value="sim"> Sim</label>
        <label><input type="radio" name="estudou" value="nao"> Não</label>
    </form>
    <p><b>Observações (opcional):</b></p>
    <textarea name="observacoes" rows="4" cols="50"></textarea>
