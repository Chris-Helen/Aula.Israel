            <form>
                <label>Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome completo" required>
                <br><br>

                <label>E-mail:</label>
                <input type="email" name="email" placeholder="exemplo@email.com" required>
                <br><br>

                <br>
                <textarea name="Digite aqui" cols="30" rows="2" placeholder="Digite aqui..." required></textarea>
                <br>

                <label>Mensagem:</label>
                <br>
                <textarea name="Digite aqui" cols="30" rows="2" placeholder="Digite sua mensagem aqui..." required></textarea>
                <br><br>

                <input type="submit" value="Enviar">
            </form>
