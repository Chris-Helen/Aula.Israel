<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Chris Helen" />
    <meta name="keywords" content="html, web, loja de roupa, moda feminina" />
    <meta name="description" content="Projeto final de desenvolvimento Front-End" />
    <title>Lumi - Moda Feminina</title>

    <link rel="stylesheet" href="../css/produto_individual.css">
</head>

<body>
    <!-- Logo -->
    <header>
        <div id="header">
            <img src="../img/logo_completa.png" alt="Logo LUMI" width="200">
            <a href="carrinho.html" id="icone_carrinho">🛍️</a>
        </div>
    </header>

    <!-- Menu de páginas -->
    <aside>
        <div id="menu">
            <ul>
                <li><a href="novidades.html">Novidades</a></li><br>
                <li><a href="vestidos.html">Vestidos</a></li><br>
                <li><a href="blusas.html">Blusas</a></li><br>
                <li><a href="calcas.html">Calças</a></li><br>
                <li><a href="saias.html">Saias</a></li><br>
            </ul>
        </div>
    </aside>

    <!-- Conteúdo da página -->
    <main>
        <div id="main">

            <div id="detalhes">

                <!-- Imagem do produto -->
                <section>
                    <img id="imagem" src="../img/calca_3.png" alt="Calça jeans azul claro wide leg cintura alta">
                </section>

                <!-- Informações do produto -->
                <section>
                    <div id="informacoes">
                        <h2>Calça jeans azul claro wide leg</h2>

                        <!-- Avaliação -->
                        <div id="avaliacao">
                            <div id="estrelas">
                                <span>★★★★★</span>
                            </div>

                            <div id="quantidade">
                                <span>(2.300)</span>
                            </div>
                        </div>

                        <!-- Preço -->
                        <div id="preco">
                            <p>R$ 219,90</p>
                        </div>

                        <!-- Descrição -->
                        <div id="descricao">
                            <p>Calça jeans azul claro wide leg cintura alta</p>
                        </div>

                        <!-- Seleção de tamanhos -->
                        <h3>Tamanho:</h3>

                        <div id="tamanhos">
                            <button id="tamanho">PP</button>
                            <button id="tamanho">P</button>
                            <button id="tamanho">M</button>
                            <button id="tamanho">G</button>
                            <button id="tamanho">GG</button>
                        </div>

                        <!-- Botão do carrinho -->
                        <button id="carrinho">Adicionar ao carrinho</button>
                    </div>
                </section>

            </div>

        </div>
    </main>

    <aside>
        <div id="coluna_direita"></div>
    </aside>

    <!-- Final da página -->
    <footer>
        <div id="footer">
            <small>&copy; 2026 LUMI - Moda Feminina</small>
        </div>
    </footer>
</body>

</html>
