<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Chris Helen" />
    <meta name="keywords" content="html, web, loja de roupa, moda feminina" />
    <meta name="description" content="Projeto final de desenvolvimento Front-End" />
    <title>Lumi - Moda Feminina</title>

    <link rel="stylesheet" href="../css/pagamento_realizado.css">
</head>

<body>
    <!-- Logo -->
    <header id="header">
        <img src="../img/logo_completa.png" alt="Logo LUMI" width="200">
    </header>

    <!-- Coluna rosa decorativa do lado esquerdo -->
    <aside id="coluna_esquerda"></aside>

    <!-- Conteúdo principal -->
    <main id="main">
        <section id="confirmacao"> <!-- Agrupa os elementos da confirmação do pedido -->
            <!-- Símbolo de sucesso -->
            <div id="icone_sucesso">✓</div>

            <!-- Mensagem principal -->
            <h1>Pedido realizado com sucesso!</h1>

            <!-- Agradecimento -->
            <h2>Obrigada por comprar na LUMI!</h2>

            <!-- Mensagem para o cliente -->
            <p>Seu pedido foi recebido com sucesso. Em breve, você receberá mais informações sobre sua compra.</p>
            <p>Esperamos ver você novamente!</p>

            <a href="novidades.html" id="voltar_loja">Continuar comprando</a>
        </section>
    </main>

    <!-- Coluna rosa decorativa do lado direito -->
    <aside id="coluna_direita"></aside>

    <!-- Final da página -->
    <footer id="footer">
        <small>&copy; 2026 LUMI - Moda Feminina</small>
    </footer>
</body>

</html>
